<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Todo App</title>
        <link
            rel="icon"
            href="favicon.png"
            type="image/png"
        />
        <link rel="stylesheet" href="global.css"/>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.3/handlebars.min.js"
            integrity="sha256-/PJBs6QWvXijOFIX04kZpLb6ZtSQckdOIavLWKKOgXU="
            crossorigin="anonymous"
            defer
        ></script>
        <script src="scripts/index.js" type="module" defer></script>
        <script src="scripts/theme.js" type="module" defer></script>
    </head>
    <body>
        <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle dark mode"
        >🌙</button>
        <main class="app-shell">
            <h1>Todo / Notizen</h1>

            <form id="note-form" class="note-form">
                <label for="note-title" class="visually-hidden">Titel der Notiz</label>
                <input
                    id="note-title"
                    name="title"
                    type="text"
                    placeholder="Titel"
                    required
                    maxlength="120"
                />
                <label for="note-content" class="visually-hidden">Notiz</label>
                <textarea
                    id="note-content"
                    name="content"
                    rows="4"
                    placeholder="Notiz oder Aufgabe"
                ></textarea>
                <div class="form-actions">
                    <button type="submit" id="save-button">Speichern</button>
                    <button
                        type="button"
                        id="cancel-edit-button"
                        class="secondary"
                        hidden
                    >Bearbeiten abbrechen</button>
                </div>
                <p
                    id="form-error"
                    class="error-message"
                    role="alert"
                ></p>
            </form>

            <section class="toolbar" aria-label="Filter und Sortierung">
                <label>
                    Sortierung
                    <select id="sort-select">
                        <option value="oldest" selected>Älteste zuerst</option>
                        <option value="newest">Neueste zuerst</option>
                    </select>
                </label>

                <label class="checkbox-label">
                    Abgeschlossene anzeigen
                    <input id="show-completed" type="checkbox"/>
                </label>
            </section>

            <ul
                id="notes-list"
                class="notes-list"
                aria-live="polite"
            ></ul>
            <p id="empty-state" class="empty-state">Keine offenen Notizen vorhanden.</p>
        </main>
    </body>
</html>

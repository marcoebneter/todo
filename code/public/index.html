<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App</title>

        <link rel="icon" href="favicon.png" type="image/png" />
        <link rel="stylesheet" href="styles/index.css" />

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.3/handlebars.min.js"
            integrity="sha256-/PJBs6QWvXijOFIX04kZpLb6ZtSQckdOIavLWKKOgXU="
            crossorigin="anonymous"
            defer
        ></script>
        <script src="scripts/index.js" type="module" defer></script>
        <script src="scripts/theme.js" type="module" defer></script>
    </head>
    <body>
        <header>
            <div class="header">
                <h1>Todo / Notizen</h1>
                <button class="btn-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </div>
        </header>

        <main class="content">
            <form id="frm-note-edit">
                <label for="note-title" class="visually-hidden">Titel der Notiz</label>
                <input id="note-title" name="title" type="text" placeholder="Titel" required maxlength="120" />
                <label for="note-content" class="visually-hidden">Beschreibung</label>
                <textarea
                    id="note-content"
                    name="content"
                    rows="4"
                    placeholder="Beschreibung der Notiz oder Aufgabe"
                ></textarea>
                <div class="toolbar">
                    <div class="left-actions">
                        <div id="save-button-mount"></div>
                        <button id="btn-cancel-edit" class="secondary" hidden>Bearbeiten abbrechen</button>
                    </div>
                    <fieldset class="priority-selector">
                        <legend>Wichtigkeit:</legend>
                        <div class="priority-indicators">
                            <span class="priority-emoji" data-priority="1">💥</span>
                            <span class="priority-emoji" data-priority="2">💥</span>
                            <span class="priority-emoji" data-priority="3">💥</span>
                        </div>
                    </fieldset>
                </div>
                <div id="form-error-mount"></div>
            </form>

            <form>
                <section class="toolbar" aria-label="Filter und Sortierung">
                    <label>
                        Sortierung
                        <select id="sort-select">
                            <option value="oldest" selected>Älteste zuerst</option>
                            <option value="newest">Neueste zuerst</option>
                        </select>
                    </label>

                    <label>
                        Abgeschlossene anzeigen
                        <input id="show-completed" type="checkbox" />
                    </label>
                </section>
            </form>

            <div id="notes-mount" aria-live="polite"></div>
        </main>

        <footer>
            <div class="footer">
                <p><small>Made with ❤️ in order of my continuing education</small></p>
                <p><small>Copyrights @ Marco Ebneter</small></p>
            </div>
        </footer>

        <script id="save-button-template" type="text/x-handlebars-template">
            <button type="submit" id="save-button">{{saveLabel}}</button>
        </script>

        <script id="form-error-template" type="text/x-handlebars-template">
            <p id="form-error" class="error-message" role="alert">{{message}}</p>
        </script>

        <script id="notes-template" type="text/x-handlebars-template">
            {{#if hasNotes}}
                <ul id="notes-list" class="notes-list" aria-live="polite">
                    {{#each notes}}
                        <li class="note-item {{#if completed}}is-completed{{/if}} {{priorityClass}}">
                            <div class="note-header">
                                <div class="note-title-row">
                                    <input
                                        type="checkbox"
                                        data-action="toggle"
                                        data-id="{{id}}"
                                        {{#if completed}}checked{{/if}}
                                        aria-label="Notiz als abgeschlossen markieren"
                                    />
                                    <h2>{{title}}</h2>
                                </div>
                                <small>Erstellt: {{createdAtLabel}}</small>
                            </div>

                            <p>{{contentLabel}}</p>

                            <div class="note-priority-display">
                                <span class="priority-indicator {{#if (gte priority 1)}}active{{/if}}">💥</span>
                                <span class="priority-indicator {{#if (gte priority 2)}}active{{/if}}">💥</span>
                                <span class="priority-indicator {{#if (gte priority 3)}}active{{/if}}">💥</span>
                            </div>

                            <div class="note-actions">
                                <button type="button" class="secondary" data-action="edit" data-id="{{id}}">Bearbeiten</button>
                                <button type="button" class="danger" data-action="delete" data-id="{{id}}">Archivieren</button>
                            </div>
                        </li>
                    {{/each}}
                </ul>
            {{else}}
                <p id="empty-state" class="empty-state">Keine offenen Notizen vorhanden.</p>
            {{/if}}
        </script>
    </body>
</html>
